---
layout: default
---
<article>
  <header class="article-head">
    <a href="{{ '/#writing' | relative_url }}" class="mono muted back">← all writing</a>
    <h1>{{ page.title }}</h1>
    <div class="p-meta">
      <span>{{ page.date | date: '%b %d, %Y' }}</span>
      <span>· {{ content | number_of_words | divided_by: 220 | plus: 1 }} min read</span>
      {% for t in page.tags %}<span class="tag">#{{ t }}</span>{% endfor %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
